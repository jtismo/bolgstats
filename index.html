<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>BolgStats</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f5f0e8;
    color: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    color-scheme: light only;
  }

  header {
    border-bottom: 3px solid #000;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f5f0e8;
  }

  .header-left { font-size: 18px; font-weight: 900; letter-spacing: 0.05em; text-transform: uppercase; }
  .header-nav { display: flex; gap: 20px; align-items: center; }
  .nav-link { font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; color: #000; }
  .nav-link.active { color: #e05a1e; border-bottom: 2px solid #e05a1e; padding-bottom: 1px; }

  .main { max-width: 680px; margin: 0 auto; padding: 32px 24px 80px; }

  .headline { font-size: clamp(42px, 10vw, 64px); font-weight: 900; text-transform: uppercase; line-height: 1; letter-spacing: -0.02em; margin-bottom: 12px; }

  .subhead { font-family: 'Courier New', Courier, monospace; font-size: 14px; color: #555; margin-bottom: 28px; line-height: 1.5; }

  /* ── SEARCH ── */
  .search-input {
    width: 100%; padding: 16px 18px;
    font-size: 16px; font-family: 'Courier New', Courier, monospace;
    border: 3px solid #000; background: #fff; color: #000; outline: none;
    box-shadow: 5px 5px 0 #000; margin-bottom: 12px;
    transition: box-shadow 0.15s;
  }
  .search-input::placeholder { color: #999; }
  .search-input:focus { box-shadow: 7px 7px 0 #000; }

  .ask-btn {
    width: 100%; padding: 16px; background: #e05a1e; color: #fff;
    border: 3px solid #000; font-size: 15px; font-weight: 900;
    letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;
    box-shadow: 5px 5px 0 #000; display: flex; align-items: center;
    justify-content: center; gap: 10px; transition: box-shadow 0.15s, transform 0.15s;
  }
  .ask-btn:hover { box-shadow: 7px 7px 0 #000; transform: translate(-1px,-1px); }
  .ask-btn:active { box-shadow: 2px 2px 0 #000; transform: translate(2px,2px); }
  .ask-btn:disabled { background: #aaa; cursor: not-allowed; transform: none; }

  /* ── RESULT ── */
  .result-box { margin-top: 24px; background: #111; border: 3px solid #000; box-shadow: 5px 5px 0 #000; padding: 24px; display: none; }
  .result-box.visible { display: block; }
  .result-label { font-size: 11px; font-weight: 900; letter-spacing: 0.2em; text-transform: uppercase; color: #e05a1e; margin-bottom: 4px; }
  .result-divider { height: 1px; background: #e05a1e; margin-bottom: 16px; }
  .result-text { font-family: 'Courier New', Courier, monospace; font-size: 14px; line-height: 1.7; color: #f0ece4; white-space: pre-wrap; }

  .loading { margin-top: 20px; font-family: 'Courier New', Courier, monospace; font-size: 13px; color: #777; display: none; align-items: center; gap: 10px; }
  .loading.visible { display: flex; }
  .spinner { width: 14px; height: 14px; border: 2px solid #ddd; border-top-color: #e05a1e; border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status { font-family: 'Courier New', Courier, monospace; font-size: 12px; color: #999; margin-bottom: 20px; }

  .archive-quote {
    margin-bottom: 20px;
    padding: 14px 16px;
    border-left: 3px solid #e05a1e;
    background: #ede7d9;
    height: 150px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
    cursor: pointer;
    text-decoration: none;
    display: block;
  }
  .archive-quote:hover { background: #e8e2d4; }
  .archive-quote-inner {
    transition: opacity 0.6s ease;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .archive-quote-inner.hidden { opacity: 0; }
  .archive-quote-label {
    display: block;
    font-family: 'Courier New', Courier, monospace;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: #e05a1e;
    margin-bottom: 8px;
  }
  .archive-quote-text {
    display: block;
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    line-height: 1.6;
    color: #333;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .archive-quote-attr {
    display: block;
    font-family: 'Courier New', Courier, monospace;
    font-size: 11px;
    color: #777;
    margin-top: 6px;
    letter-spacing: 0.04em;
  }

  /* ── BOOT ── */
  #boot {
    position: fixed; inset: 0; background: #f5f0e8; z-index: 999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; transition: opacity 0.4s; padding: 40px 24px; text-align: center;
  }
  #boot.out { opacity: 0; pointer-events: none; }

  .boot-title { font-size: 32px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; }
  .boot-title span { color: #e05a1e; }
  .boot-msg { font-family: 'Courier New', Courier, monospace; font-size: 13px; color: #777; }
  .boot-track { width: 200px; height: 3px; background: #ddd; }
  .boot-fill { height: 100%; background: #e05a1e; width: 0%; transition: width 0.35s ease; }

  .error { margin-top: 16px; font-family: 'Courier New', Courier, monospace; font-size: 13px; color: #c00; display: none; }
  .error.visible { display: block; }
</style>
</head>
<body>

<div id="boot">
  <div class="boot-title">Bolg<span>Stats</span></div>
  <div class="boot-msg" id="bootMsg">Loading archive…</div>
  <div class="boot-track"><div class="boot-fill" id="bootFill"></div></div>
</div>

<header>
  <div class="header-left">The Bolg Stats</div>
  <nav class="header-nav">
    <a class="nav-link active" href="#">Search</a>
    <a class="nav-link" href="https://thebolg.com" target="_blank">Archive</a>
  </nav>
</header>

<div class="main">
  <div class="headline">The Bolg<br>is Alive.</div>
  <div class="subhead">Ask anything about our collective music opinions.</div>

  <a class="archive-quote" id="archiveQuote" href="#" target="_blank" rel="noopener">
    <div class="archive-quote-inner" id="archiveQuoteInner">
      <span class="archive-quote-label" id="archiveQuoteLabel">From the archive</span>
      <span class="archive-quote-text" id="archiveQuoteText">Loading archive…</span>
      <span class="archive-quote-attr" id="archiveQuoteAttr"></span>
    </div>
  </a>

  <div class="status" id="status">Loading archive…</div>

  <input class="search-input" id="q" type="text"
    placeholder="Loading…"
    autocomplete="off" onkeydown="if(event.key==='Enter') ask()">

  <button class="ask-btn" id="askBtn" onclick="ask()" disabled>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    Ask
  </button>

  <div class="loading" id="loading"><div class="spinner"></div> <span id="loadingMsg">Searching the archive…</span></div>
  <div class="error" id="errBox"></div>

  <div class="result-box" id="resultBox">
    <div class="result-label" id="resultLabel">The Archive Says:</div>
    <div class="result-divider"></div>
    <div class="result-text" id="resultText"></div>
  </div>
</div>

<script>
const BLOG = 'thebolg';
const TUMBLR_KEY = 'BRqwhfZWyoRss6ax8Gbb4UrijPqO1aedOzYsVQfpIm23h9nmvU';
const CKEY = 'thebolg_albums_v1';
const TTL  = 60 * 60 * 1000;

let POSTS = [];

// ── PLACEHOLDER POOL ────────────────────────────────────────────────────────
const PLACEHOLDERS = [
  'Who gives the most 8s?',
  'What\'s the most underrated album in the archive?',
  'Who hates pop music the most?',
  'What album caused the most disagreement?',
  'What\'s the best reviewed hip-hop record?',
  'Which reviewer is the harshest?',
  'What\'s the highest rated album ever?',
  'Who reviews the most dance music?',
  'What\'s the funniest review in the archive?',
  'Which albums got a perfect 10?',
  'Who has the most eclectic taste?',
  'What\'s the worst reviewed album?',
  'Which reviewer changed their mind the most?',
  'What genre gets the highest scores on average?',
];

let placeholderIndex = Math.floor(Math.random() * PLACEHOLDERS.length);

function rotatePlaceholder() {
  placeholderIndex = (placeholderIndex + 1) % PLACEHOLDERS.length;
  document.getElementById('q').placeholder = PLACEHOLDERS[placeholderIndex];
}

async function init() {
  // Pick random reviewer

  // Set first placeholder
  document.getElementById('q').placeholder = PLACEHOLDERS[placeholderIndex];

  const cached = readCache();
  if (cached) {
    POSTS = cached;
    bMsg(`${POSTS.length} reviews loaded.`, 100);
    await sleep(400);
    return done();
  }

  bMsg('Loading archive…', 20);
  try {
    const res = await fetch('/reviews.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    POSTS = await res.json();
    writeCache(POSTS);
    bMsg(`${POSTS.length} reviews loaded.`, 100);
    await sleep(400);
  } catch(e) {
    showErr(`Could not load archive: ${e.message}`);
  }
  done();
}



// ── ASK ─────────────────────────────────────────────────────────────────────
async function ask() {
  const q = document.getElementById('q').value.trim();
  if (!POSTS.length) return;

  // If empty, use the placeholder as the question
  const question = q || document.getElementById('q').placeholder;

  const btn  = document.getElementById('askBtn');
  const load = document.getElementById('loading');
  const box  = document.getElementById('resultBox');
  const txt  = document.getElementById('resultText');
  const lMsg = document.getElementById('loadingMsg');

  btn.disabled = true;
  lMsg.textContent = `Searching the archive…`;
  load.classList.add('visible');
  box.classList.remove('visible');

  const simpleErrors = { rateLimit: 'too many questions at once — try again in a minute.', credit: 'out of API credits — add some at console.anthropic.com.', noAnswer: 'nothing came back — try rephrasing.' };

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question,
        albums: POSTS,

      })
    });
    const d = await res.json();

    document.getElementById('resultLabel').textContent = 'The Archive Says:';
    
    // Check if the answer contains an error
    const answer = d.answer || '';
    const name = currentReviewer.name;
    if (answer.includes('credit balance') || answer.includes('too low')) {
      txt.textContent = `${creditErrors[name] || 'out of API credits.'} (billing error — add credits at console.anthropic.com)`;
    } else if (answer.includes('rate limit') || answer.includes('50,000')) {
      txt.textContent = `${rateLimitErrors[name] || 'try again in a minute.'} (rate limit — wait 60 seconds)`;
    } else if (!answer || answer === 'No answer found.') {
      txt.textContent = `${noAnswerErrors[name] || 'no answer found — try rephrasing.'} (no result)`;
    } else {
      txt.textContent = answer;
    }
    box.classList.add('visible');

    rotatePlaceholder();
  } catch(e) {
    document.getElementById('resultLabel').textContent = 'The Archive Says:';
        txt.textContent = rateLimitErrors[currentReviewer.name] || 'something went wrong — try again in a minute.';
    box.classList.add('visible');
  }

  btn.disabled = false;
  load.classList.remove('visible');
}

// ── CACHE ────────────────────────────────────────────────────────────────────
function writeCache(p) { try { sessionStorage.setItem(CKEY, JSON.stringify({ts:Date.now(),p})); } catch{} }
function readCache() {
  try { const {ts,p} = JSON.parse(sessionStorage.getItem(CKEY)||'null'); return Date.now()-ts>TTL?null:p; }
  catch { return null; }
}

function bMsg(m,pct) { document.getElementById('bootMsg').textContent=m; document.getElementById('bootFill').style.width=pct+'%'; }
function done() {
  const b=document.getElementById('boot'); b.classList.add('out');
  setTimeout(()=>b.style.display='none',400);
  document.getElementById('status').textContent = `${POSTS.length} albums · ${POSTS.reduce((s,a)=>s+(a.reviews||[]).length,0)} reviews in the archive.`;
  document.getElementById('askBtn').disabled = false;
  startQuoteCycle();
}

function startQuoteCycle() {
  if (!POSTS.length) return;

  const inner  = document.getElementById('archiveQuoteInner');
  const textEl = document.getElementById('archiveQuoteText');
  const attrEl = document.getElementById('archiveQuoteAttr');

  // Build pool grouped by year
  const byYear = {};
  POSTS.forEach(a => {
    (a.reviews||[]).forEach(r => {
      if (!r.text || r.text.length < 30 || r.text.length > 220) return;
      const y = a.year;
      if (!byYear[y]) byYear[y] = [];
      byYear[y].push({ text: r.text, reviewer: r.reviewer, score: r.score, album: a.album, artist: a.artist, year: y, url: a.tumblrUrl || null });
    });
  });

  const availableYears = Object.keys(byYear).map(Number).sort();
  const currentYear = new Date().getFullYear();
  let lastKey = null;

  function pickQuote() {
    const yearsAgo = Math.floor(Math.random() * 12) + 1;
    const targetYear = currentYear - yearsAgo;
    const closest = availableYears.reduce((a, b) =>
      Math.abs(b - targetYear) < Math.abs(a - targetYear) ? b : a
    );
    const pool = byYear[closest];
    let idx;
    do { idx = Math.floor(Math.random() * pool.length); } while (pool.length > 1 && `${closest}-${idx}` === lastKey);
    lastKey = `${closest}-${idx}`;
    return { ...pool[idx], actualYearsAgo: currentYear - closest };
  }

  function showQuote() {
    inner.classList.add('hidden');
    setTimeout(() => {
      const q = pickQuote();
      const score = q.score != null ? ` · ${q.score}` : '';
      const yearsAgo = q.actualYearsAgo;
      const label = yearsAgo === 1 ? '1 year ago today' : `${yearsAgo} years ago today`;
      document.getElementById('archiveQuoteLabel').textContent = label;
      textEl.textContent = `"${q.text}"`;
      attrEl.textContent = `— ${q.reviewer}${score} on ${q.album} by ${q.artist}`;
      if (q.url) document.getElementById('archiveQuote').href = q.url;
      inner.classList.remove('hidden');
    }, 650);
  }

  showQuote();
  setInterval(showQuote, 15000);
}
function showErr(m) { const e=document.getElementById('errBox'); e.textContent=m; e.classList.add('visible'); }
function strip(h) { return h.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim(); }
function sleep(ms) { return new Promise(r=>setTimeout(r,ms)); }

init();
</script>
</body>
</html>
