<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>BolgStats Admin</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f5f0e8; font-family: 'Courier New', monospace; font-size: 13px; color: #000; padding: 24px; }
  h1 { font-size: 22px; font-weight: 900; text-transform: uppercase; margin-bottom: 6px; }
  h1 span { color: #e05a1e; }
  .sub { color: #777; margin-bottom: 20px; font-size: 12px; }

  .auth-row { display: flex; gap: 8px; margin-bottom: 20px; }
  .auth-input { flex: 1; padding: 10px 12px; border: 2px solid #000; background: #fff; font-family: 'Courier New', monospace; font-size: 13px; outline: none; }
  .auth-input:focus { border-color: #e05a1e; }
  .btn { padding: 10px 20px; background: #e05a1e; color: #fff; border: 2px solid #000; font-family: 'Courier New', monospace; font-size: 13px; font-weight: 700; text-transform: uppercase; cursor: pointer; }
  .btn:hover { background: #c04010; }
  .btn.secondary { background: #000; }
  .btn.secondary:hover { background: #333; }

  .stats-bar { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat { background: #fff; border: 2px solid #000; padding: 12px 16px; }
  .stat-val { font-size: 24px; font-weight: 900; color: #e05a1e; }
  .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: #777; margin-top: 2px; }

  .filter-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .filter-input { padding: 8px 12px; border: 2px solid #aaa; background: #fff; font-family: 'Courier New', monospace; font-size: 13px; outline: none; }
  .filter-input:focus { border-color: #e05a1e; }

  table { width: 100%; border-collapse: collapse; background: #fff; border: 2px solid #000; }
  th { text-align: left; padding: 10px 12px; background: #000; color: #fff; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; }
  td { padding: 10px 12px; border-bottom: 1px solid #e0dbd2; vertical-align: top; }
  tr:hover td { background: #faf8f4; }
  .question-text { line-height: 1.5; }
  .reviewer-tag { display: inline-block; padding: 2px 8px; background: #e05a1e; color: #fff; font-size: 11px; }
  .time { color: #999; font-size: 11px; }
  .del-btn { padding: 3px 8px; background: transparent; border: 1px solid #ccc; font-family: 'Courier New', monospace; font-size: 11px; cursor: pointer; color: #999; }
  .del-btn:hover { border-color: #c00; color: #c00; }

  .empty { padding: 40px; text-align: center; color: #aaa; }
  .error { color: #c00; padding: 12px; border: 1px solid #c00; background: #fff3f3; margin-bottom: 16px; display: none; }
  .error.visible { display: block; }
</style>
</head>
<body>
<h1>Bolg<span>Stats</span> Admin</h1>
<div class="sub">Search query log. Keep this URL private.</div>

<div class="auth-row">
  <input class="auth-input" id="adminKey" type="password" placeholder="Admin key…" onkeydown="if(event.key==='Enter') load()">
  <button class="btn" onclick="load()">Load</button>
  <button class="btn secondary" onclick="clearAll()">Clear All</button>
</div>

<div class="error" id="errBox"></div>

<div class="stats-bar" id="statsBar" style="display:none">
  <div class="stat"><div class="stat-val" id="statTotal">0</div><div class="stat-label">Total Searches</div></div>
  <div class="stat"><div class="stat-val" id="statToday">0</div><div class="stat-label">Today</div></div>
  <div class="stat"><div class="stat-val" id="statUnique">0</div><div class="stat-label">Unique Questions</div></div>
  <div class="stat"><div class="stat-val" id="statTopReviewer">—</div><div class="stat-label">Most Used Reviewer</div></div>
</div>

<div class="filter-row" id="filterRow" style="display:none">
  <input class="filter-input" id="filterText" placeholder="Filter questions…" oninput="renderTable()">
  <select class="filter-input" id="filterReviewer" onchange="renderTable()">
    <option value="">All reviewers</option>
  </select>
</div>

<div id="tableWrap"></div>

<script>
let allQueries = [];
let adminKey = '';

async function load() {
  adminKey = document.getElementById('adminKey').value.trim();
  if (!adminKey) return;

  try {
    const res = await fetch('/api/queries', { headers: { 'x-admin-key': adminKey } });
    if (!res.ok) { showErr('Wrong admin key or not authorized.'); return; }
    allQueries = await res.json();
    showErr('');
    renderStats();
    renderTable();
    document.getElementById('statsBar').style.display = 'flex';
    document.getElementById('filterRow').style.display = 'flex';
  } catch(e) {
    showErr(`Error: ${e.message}`);
  }
}

async function clearAll() {
  if (!adminKey) { showErr('Load first.'); return; }
  if (!confirm('Delete all query logs?')) return;
  await Promise.all(allQueries.map(q =>
    fetch(`/api/queries?id=${encodeURIComponent(q.id)}`, {
      method: 'DELETE',
      headers: { 'x-admin-key': adminKey }
    })
  ));
  allQueries = [];
  renderStats();
  renderTable();
}

async function deleteOne(id) {
  await fetch(`/api/queries?id=${encodeURIComponent(id)}`, {
    method: 'DELETE',
    headers: { 'x-admin-key': adminKey }
  });
  allQueries = allQueries.filter(q => q.id !== id);
  renderStats();
  renderTable();
}

function renderStats() {
  const today = new Date().toDateString();
  const todayCount = allQueries.filter(q => new Date(q.timestamp).toDateString() === today).length;
  const unique = new Set(allQueries.map(q => (q.question||'').toLowerCase().trim())).size;
  const revCounts = {};
  allQueries.forEach(q => { revCounts[q.reviewer] = (revCounts[q.reviewer]||0) + 1; });
  const topRev = Object.entries(revCounts).sort((a,b)=>b[1]-a[1])[0];

  document.getElementById('statTotal').textContent = allQueries.length;
  document.getElementById('statToday').textContent = todayCount;
  document.getElementById('statUnique').textContent = unique;
  document.getElementById('statTopReviewer').textContent = topRev ? topRev[0] : '—';

  // Update reviewer filter
  const sel = document.getElementById('filterReviewer');
  const current = sel.value;
  const reviewers = [...new Set(allQueries.map(q => q.reviewer).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">All reviewers</option>' +
    reviewers.map(r => `<option value="${r}" ${r===current?'selected':''}>${r}</option>`).join('');
}

function renderTable() {
  const filterText = document.getElementById('filterText').value.toLowerCase();
  const filterRev  = document.getElementById('filterReviewer').value;

  const filtered = allQueries.filter(q => {
    if (filterText && !(q.question||'').toLowerCase().includes(filterText)) return false;
    if (filterRev  && q.reviewer !== filterRev) return false;
    return true;
  });

  if (!filtered.length) {
    document.getElementById('tableWrap').innerHTML = '<div class="empty">No queries yet.</div>';
    return;
  }

  document.getElementById('tableWrap').innerHTML = `
    <table>
      <tr>
        <th>Question</th>
        <th>Reviewer</th>
        <th>Time</th>
        <th></th>
      </tr>
      ${filtered.map(q => `
        <tr>
          <td class="question-text">${esc(q.question || '—')}</td>
          <td><span class="reviewer-tag">${esc(q.reviewer || '—')}</span></td>
          <td class="time">${fmtTime(q.timestamp)}</td>
          <td><button class="del-btn" onclick="deleteOne('${esc(q.id)}')">✕</button></td>
        </tr>
      `).join('')}
    </table>`;
}

function fmtTime(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' +
    d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showErr(msg) {
  const e = document.getElementById('errBox');
  e.textContent = msg;
  e.classList.toggle('visible', !!msg);
}
</script>
</body>
</html>
